name: 'AIKavach VAYU Autonomous CRS'
description: 'Autonomous Cyber Reasoning System - Find, Reason, Patch, and Verify Vulnerabilities'
inputs:
  repository_path:
    description: 'Path to target repository to scan and remediate'
    required: false
    default: '.'
  model:
    description: 'Ollama model to use'
    required: false
    default: 'qwen2.5-coder:3b'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run AIKavach VAYU CRS
      shell: bash
      run: |
        python -m crs.vayu ${{ inputs.repository_path }}
